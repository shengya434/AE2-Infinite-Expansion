buildscript {
    repositories {
        // 2026-10-02：官方 forge 源在国内会偶发 `Remote host terminated the handshake`
        // （实测：大多数依赖下来了，javaxdelta / trove / jsr305 三个握手被打断 → BUILD FAILED）
        // ⇒ 先走国内镜像，再回落到官方源。BMCLAPI 是 maven.minecraftforge.net 的完整镜像。
        maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    // 2026-10-02: CurseMaven serves the AE2-UEL jar pinned below (CurseForge has no usable maven of its own).
    maven { url = 'https://cursemaven.com' }
    // BlameJared's maven is where JEI 1.12.2 lives (verified 2026-10-02: the pom and the 680,403-byte jar
    // both return HTTP 200, and maven-metadata lists 4.16.5.1030 among the published versions).
    maven { url = 'https://maven.blamejared.com' }
    // CN mirrors first, then upstream: maven.minecraftforge.net sometimes drops the TLS handshake here.
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

version = '0.1.0-1.12.2'
group = 'com.ae2addon' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'ae2-addon-1122'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

// JDK 8 on a Chinese Windows defaults file.encoding to GBK, so javac mis-decodes our UTF-8 sources and
// fails with "unmappable character for encoding GBK" on every Chinese comment. Pin the source encoding
// explicitly; the class file constant pool is UTF-8 either way, so runtime is unaffected.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    // 2026-10-02：换成 1.12.2 社区标准映射（AE2-UEL / 绝大多数 1.12.2 mod 都用它，便于对照 AE2 源码）
    mappings channel: 'stable', version: '39-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // AE2-UEL (Applied Energistics 2 Unofficial Extended Life) v0.56.7 -- the authoritative AE2 for 1.12.2
    // (official rv6-stable-7 is abandoned since 2019; every 1.12.2 pack ships UEL instead).
    // CurseForge project 570458 "ae2-extended-life", file id 6302098.
    // Verified 2026-10-02: jar SHA256 DFCA9F74CFEBB4E79806AE77CD6BCEDC30649BE2B0E505E06D629386B0C3074E (4,451,298 B),
    // byte-identical to the copy installed in the 1.12.2 test instance.
    //
    // TWO NON-OBVIOUS THINGS (both cost real debugging time on 2026-10-02):
    //  1. ForgeGradle 3.0.197 removed the `deobfCompile` configuration; its own message says to wrap the
    //     dependency in `fg.deobf(...)` inside a standard configuration instead. The AE2 jar is SRG-named,
    //     so it MUST go through the deobf remapper or every net.minecraft reference fails to compile.
    //  2. CurseMaven no longer accepts the legacy `curse.maven:<slug>:<fileid>` form (it 404s on the jar
    //     while still serving a stub .pom, which makes it look like a transient failure). Its own 400 body
    //     states the descriptor must be `<modname>-<projectid>`, so the group+name must be
    //     `ae2-extended-life-570458`. Verified: that URL returns the 4,451,298-byte jar.
    compile fg.deobf('curse.maven:ae2-extended-life-570458:6302098')

    // JEI 4.16.5.1030 -- COMPILE ONLY, and compiled against a local copy on purpose.
    //
    // WHY A LOCAL FILE instead of fg.deobf('mezz.jei:jei_1.12.2:4.16.5.1030'):
    //   fg.deobf rewrites the dependency to a `4.16.5.1030_mapped_stable_39-1.12` coordinate and then tries
    //   to *find* that in the repositories (it assumes a mapped artifact already exists), which fails with
    //   "Could not find mezz.jei:jei_1.12.2:4.16.5.1030_mapped_stable_39-1.12". AE2 resolves because its
    //   jar goes through ForgeGradle's own remap cache; JEI's does not.
    //   We do not actually need the remap: JEI keeps its `mezz.jei.api` package unobfuscated, and the
    //   classes we touch only ever reference Minecraft by *class* name (net.minecraft.client.gui.GuiScreen)
    //   plus java.awt.Rectangle -- verified with javap on this exact jar. No MCP method names are involved.
    //
    // WHAT THIS JAR IS: libs/jei_1.12.2-4.16.5.1030.jar, 680,403 B, SHA256
    //   73357B5C3B5F44F6D0CE667BBED21BA4C5DB49070944CA2BC0FA73B8D9061D51
    //   -- verified byte-identical to both the jar installed in the 1.12.2 test instance and the copy
    //   served by https://maven.blamejared.com/mezz/jei/jei_1.12.2/4.16.5.1030/ (checked 2026-10-02).
    //
    // IT MUST NEVER BE BUNDLED: there is no Shadow plugin and no relocation here, so shipping JEI inside our
    // jar would simply collide with the real mod. compileOnly guarantees it stays out.
    // With JEI absent at runtime nothing loads our @JEIPlugin class (only JEI's scanner looks for it), so no
    // defensive isModLoaded guard is needed.
    compileOnly files('libs/jei_1.12.2-4.16.5.1030.jar')

    // 拼音搜索：不引第三方库。只把 pinyin4j 的**数据表**（BSD，见 resources/ae2addon/pinyin/NOTICE.txt）
    // 打进 jar，解析在 com.ae2addon.util.PinyinIndex 里自己做。
    // 为什么不 shade pinyin4j 本体：Shadow 插件在 Gradle 4.9 上已取不到（插件门户只留 8.1.x，需 Gradle 8，
    // 国内无镜像），而升 Gradle 会动整个 1.12.2 工具链；且 pinyin4j 还会拖进 com.hp.hpl.sparta，
    // 徒增与其它 mod 撞类的面。

}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "ae2addon",
            "Specification-Vendor": "ae2addon",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"ae2addon",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// mcmod.info carries ${version} / ${mcversion} placeholders. WITHOUT this block they are copied into
// the jar verbatim -- verified on the P0 artifact, whose mcmod.info literally contained "${version}".
processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
