description='''
§5AE2 Infinite Expansion§r — 为 AE2 带来真正的无限存储体验！

§6✦ 万能无限存储元件§r
  • 三种模式：无限存储 / 自定义无限 / 全类型无限
  • 模式切换，满足不同场景需求
  • 全类型无限模式自动覆盖所有注册物品与流体
  • 内置拼音搜索的中文配置界面

§6✦ 无限合成存储器§r
  • 单个方块提供 §bLong.MAX_VALUE§r 字节的合成存储空间
  • 搭配 §aGridMixin§r 让 AE2 正确识别子类合成方块

§6✦ 无限并行处理单元§r
  • 单个方块提供 §bInteger.MAX_VALUE§r 线程！
  • 移除原版 16 线程上限
  • 海量并行合成，秒级完成万亿配方

§6✦ 集成型 CPU（无限级）§r
  • 3×5×3 多方块结构：无限合成存储 + 无限并行
  • 结构成型接入 AE 网络后拥有无限级 CPU 功能
  • 挖取保留成型状态，JEI 内置结构预览
  • Mode 2 支持 §atag / mod 批量无限§r（如 minecraft:logs、整个 mod）

§8灵感来源: OmniSequence: Transfinite (MIT)§r — 量子分裂/时间片限流思路
'''

